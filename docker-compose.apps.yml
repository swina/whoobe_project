# Whoobe CMS - application services only.
# Postgres and S3 are EXCLUDED by design: they run as external
# infrastructure and are reached through the root .env (DB_HOST, S3_ENDPOINT).
#
# Build:
#   docker compose -f docker-compose.apps.yml build
# Run:
#   docker compose -f docker-compose.apps.yml up -d
#
# Ports: admin-dashboard 3000, asset-processor 3002, core-api 3003,
# whoobe-one-spike 8006.

services:
  core-api:
    build:
      context: .
      target: core-api
    container_name: whoobe_core_api
    ports:
      - "${WS_APP_BIND_ADDRESS:-0.0.0.0}:3003:3003"
    env_file: .env
    environment:
      NODE_ENV: production
    restart: unless-stopped

  asset-processor:
    build:
      context: .
      target: asset-processor
    container_name: whoobe_asset_processor
    ports:
      - "${WS_APP_BIND_ADDRESS:-0.0.0.0}:3002:3002"
    env_file: .env
    environment:
      NODE_ENV: production
    restart: unless-stopped

  admin-dashboard:
    build:
      context: .
      target: admin-dashboard
      args:
        VITE_ASSET_PROCESSOR_URL: http://${WHOOBE_HOSTNAME:-localhost}:3002
        VITE_CORE_API_URL: http://${WHOOBE_HOSTNAME:-localhost}:3003
        VITE_FONT_FAMILIES: ${VITE_FONT_FAMILIES}
    container_name: whoobe_admin_dashboard
    ports:
      - "${WS_APP_BIND_ADDRESS:-0.0.0.0}:3000:8080"
    restart: unless-stopped

  whoobe-one-spike:
    build:
      context: .
      target: whoobe-one-spike
      args:
        VITE_BASE_URL: /whoobe-one/
    container_name: whoobe_one_spike
    ports:
      - "${WS_APP_BIND_ADDRESS:-0.0.0.0}:3006:8080"
    restart: unless-stopped

  # Optional: runs the site generator for the dashboard's Publish tab. Start it with `--profile publisher`. It reaches
  # core-api over HTTP only (no DB_* / S3_* variables here on purpose); releases land in the publish volume.
  publisher:
    profiles: ["publisher"]
    build:
      context: .
      target: publisher
    container_name: whoobe_publisher
    environment:
      CORE_API_URL: http://core-api:3003
      PUBLISH_RUNNER_TOKEN: ${PUBLISH_RUNNER_TOKEN:?set PUBLISH_RUNNER_TOKEN (same value as core-api)}
      PUBLISH_ROOT: /publish
    volumes:
      - whoobe_published:/publish
    restart: unless-stopped
    depends_on:
      - core-api

volumes:
  whoobe_published:
