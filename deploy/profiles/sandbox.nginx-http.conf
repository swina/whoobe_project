# http-level part of the sandbox profile: the zones and the visit log that WS_EDGE_LIMITS refers to. Copied by provision-workspace.sh to
# deploy/nginx/ (conf.d is loaded in the http context).
limit_req_zone $binary_remote_addr zone=sandbox_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sandbox_conn:10m;

# Visit log of the sandbox (its own file, not the host's shared access.log): who came, what they did, where from - without
# identifying anybody. The address is cut to its network (IPv4 /24, IPv6 /48), the query string is not logged, and the files
# rotate with the host's logrotate (14 days on Ubuntu). Read it with scripts/sandbox/visits.sh. Static files and /health are not logged.
map $remote_addr $sandbox_ip {
    ~^(?<net>\d+\.\d+\.\d+)\.\d+$        $net.0;
    ~^(?<net6>[0-9a-fA-F]+:[0-9a-fA-F]+:[0-9a-fA-F]+):  $net6::;
    default                             0.0.0.0;
}
map $request_uri $sandbox_path {
    ~^(?<p>[^?]*)   $p;
    default         $request_uri;
}
map $sandbox_path $sandbox_path_loggable {
    ~*\.(js|mjs|css|map|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf)$   0;
    /health                                                              0;
    default                                                              1;
}
# Addresses whose requests are not written at all (the owner's own, a monitor): SANDBOX_UNTRACKED_IPS in /etc/whoobe-sandbox.env,
# put in place of the marker below by provision-workspace.sh at each reset. They still reach the sandbox; only the log skips them.
geo $sandbox_untracked {
    default 0;
    # @SANDBOX_UNTRACKED_IPS@
}
map $sandbox_untracked $sandbox_loggable {
    1        0;
    default  $sandbox_path_loggable;
}
log_format sandbox_visits '$time_iso8601 $sandbox_ip $request_method $sandbox_path $status $request_time "$http_referer" "$http_user_agent"';
