# http-level part of the sandbox profile: the zones that WS_EDGE_LIMITS refers to. Copied by provision-workspace.sh to
# deploy/nginx/ (conf.d is loaded in the http context).
limit_req_zone $binary_remote_addr zone=sandbox_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=sandbox_conn:10m;
