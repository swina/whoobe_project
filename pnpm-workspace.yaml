packages:
  - 'packages/*'
  - 'packages/sdk/*'
  - 'apps/*'
  - 'scripts/security'
  # sites/* (whoobe-publish output, gitignored) is deliberately NOT a
  # workspace member: it used to need to be, back when a generated site
  # depended on packages/sdk/* via workspace:*/file: references into this
  # repo - now that whoobe-publish vendors its SDK dependencies as plain
  # tarballs (packSdkDependencies, see CHANGES.md), a generated site is
  # fully self-contained and installs on its own (`cd sites/<hash> && pnpm
  # install`). Listing it here did active harm: a plain `pnpm install` at
  # the repo root tried to resolve every sites/* member together with
  # everything else, and a workspace member's own `pnpm.overrides` (which
  # is how a generated site points its internal @whoobe-cms/* deps at its
  # local vendor/*.tgz instead of the public npm registry) is only read
  # from the WORKSPACE ROOT, never from the member's own package.json -
  # so the override silently never applied, and the whole repo's install
  # failed with ERR_PNPM_FETCH_404 the moment any site existed under
  # sites/ (found live, not hypothetical).

# Dependency overrides (security fixes for transitive deps, see
# docs/release/security/findings.md F-003). Kept in BOTH places on purpose:
# pnpm 9 (the pinned packageManager, used by the Dockerfile) reads
# package.json "pnpm.overrides"; pnpm 10+/11 only read this file. Keep the
# two lists identical.
overrides:
  postcss: ^8.5.23
  nanoid: ^3.3.18
  underscore: ^1.13.8
  qs: ^6.16.0
  fast-uri: ^3.1.8
  markdown-it: ^14.3.3
  dompurify: ^3.4.17
  proxy-addr: ^2.0.8
  source-map-js: ^1.2.2
  prosemirror-view: ^1.42.3
  vue: ^3.5.42
  "@vue/server-renderer": ^3.5.42
  body-parser: ^1.20.9
  undici: ^6.29.1
