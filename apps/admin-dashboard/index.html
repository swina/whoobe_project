<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100 light:bg-slate-50 light:text-slate-900">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whoobe CMS - Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
    <!-- Applied before Vue mounts (themeStore.ts owns this after that) -
         avoids a flash of the dark default for a returning light-theme
         user, read synchronously from localStorage. -->
    <script>
      try {
        if (localStorage.getItem('whoobe:theme') === 'light') document.documentElement.classList.add('light')
      } catch {}
    </script>
  </head>
  <body class="h-full font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="app" class="h-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
