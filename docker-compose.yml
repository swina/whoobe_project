# Whoobe - stack definition, shared by local dev and per-workspace deploys.
#   Local dev:        docker compose up -d --build
#   Per workspace:    docker compose -p ws-<slug> --env-file .env.<slug> up -d --build
#                      (see scripts/provision-workspace.sh and
#                      docs/plans/system/workspaces-plan.md)
#
# No `container_name:` on any service - each is left to Compose's own
# per-project naming (<project>-<service>-<n>) so the same file can be
# brought up more than once under different -p project names without
# colliding on container names, one running stack per workspace.
#
# WS_APP_BIND_ADDRESS (default 0.0.0.0: reachable from the LAN, as in development) is set to 127.0.0.1 for every
# workspace behind a reverse proxy (provision-workspace.sh does it): only nginx should reach those ports.
#
# Host-side ports are all overridable (WS_*_PORT, default = today's fixed
# dev ports) for the same reason - only the host side needs to be unique
# per workspace; every service inside one workspace's project talks to the
# others over that project's own private network on its fixed internal
# port, so internal ports never need to change.
#
# The Vite frontends (admin-dashboard port 3000, whoobe-one-spike port 3006)
# are served by nginx. Browser-facing API URLs are baked at build time via
# --build-arg, sourced from VITE_ASSET_PROCESSOR_URL / VITE_CORE_API_URL /
# VITE_GATEWAY_URL in the env file in use (.env for dev, .env.<slug> for a
# workspace) - see .env.example for the dev default (per-port localhost
# URLs) vs. docs/deployment.md's production convention (bare hostname,
# nginx path-routes to the right upstream).
#
# Object storage: Garage (S3-compatible, docker/garage) runs here by default (profile `local-s3`, enabled through
# COMPOSE_PROFILES=local-s3 in the env file); it creates its own bucket and key on first start. To use AWS S3, another
# cloud or an existing enterprise store instead: drop `local-s3` from COMPOSE_PROFILES and set S3_CONTAINER_ENDPOINT
# (+ S3_REGION/S3_BUCKET/credentials, S3_FORCE_PATH_STYLE). MinIO: docker-compose.minio.yml overlay. See
# docs/storage-backends.md.

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # no default: a database must never come up with a password everybody knows (see .env.example)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the env file}
      POSTGRES_DB: ${POSTGRES_DB:-whoobe_db}
    ports:
      # data services are for the other containers (private network) and the host's own tools: loopback only.
      # WS_DATA_BIND_ADDRESS=0.0.0.0 only if you really need them from another machine, and then with strong secrets.
      - "${WS_DATA_BIND_ADDRESS:-127.0.0.1}:${WS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: hands a fresh (root-owned) data volume to the unprivileged garage user. Idempotent and fast.
  garage-perms:
    build:
      context: ./docker/garage
    image: whoobe-garage:v2.4.1
    profiles: ["local-s3"]
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /var/lib/garage"]
    volumes:
      - garagedata:/var/lib/garage
    restart: "no"

  garage:
    # Local / LAN S3 store (docker/garage: official binary + automatic first-run setup)
    build:
      context: ./docker/garage
    image: whoobe-garage:v2.4.1
    profiles: ["local-s3"]
    depends_on:
      garage-perms:
        condition: service_completed_successfully
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the env file (GK + 24 hex)}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the env file (64 hex)}
      S3_BUCKET: ${S3_BUCKET:-whoobe-cms}
      S3_REGION: ${S3_REGION:-us-east-1}
    ports:
      # loopback only: browsers get assets through the asset-processor, not from the store
      - "${WS_DATA_BIND_ADDRESS:-127.0.0.1}:${WS_S3_API_PORT:-9000}:3900"
    volumes:
      - garagedata:/var/lib/garage
    restart: unless-stopped

  core-api:
    build:
      context: .
      target: core-api
    ports:
      - "${WS_APP_BIND_ADDRESS:-0.0.0.0}:${WS_CORE_API_PORT:-3003}:3003"
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      S3_ENDPOINT: ${S3_CONTAINER_ENDPOINT:-http://garage:3900}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      # empty = the seed generates a random password and prints it once in the core-api log (never a default one)
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  asset-processor:
    build:
      context: .
      target: asset-processor
    ports:
      - "${WS_APP_BIND_ADDRESS:-0.0.0.0}:${WS_ASSET_PROCESSOR_PORT:-3002}:3002"
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      S3_ENDPOINT: ${S3_CONTAINER_ENDPOINT:-http://garage:3900}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      garage:
        condition: service_healthy
        required: false   # not started when an external S3 is used (no `local-s3` profile)
      postgres:
        condition: service_healthy
      # core-api creates/migrates the schema on boot; starting earlier made the
      # asset-processor's first poll fail with 42P01 (relation does not exist).
      core-api:
        condition: service_healthy
    restart: unless-stopped

  admin-dashboard:
    build:
      context: .
      target: admin-dashboard
      args:
        VITE_ASSET_PROCESSOR_URL: ${VITE_ASSET_PROCESSOR_URL}
        VITE_CORE_API_URL: ${VITE_CORE_API_URL}
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL}
        VITE_FONT_FAMILIES: ${VITE_FONT_FAMILIES}
        VITE_WHOOBE_ONE_URL: ${VITE_WHOOBE_ONE_URL:-}
    ports:
      - "${WS_APP_BIND_ADDRESS:-0.0.0.0}:${WS_ADMIN_DASHBOARD_PORT:-3000}:8080"
    restart: unless-stopped

  whoobe-one-spike:
    build:
      context: .
      target: whoobe-one-spike
      args:
        VITE_BASE_URL: /whoobe-one/
        VITE_ASSET_PROCESSOR_URL: ${VITE_ASSET_PROCESSOR_URL}
        VITE_CORE_API_URL: ${VITE_CORE_API_URL}
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL}
    environment:
      # who may frame the editor (the admin embeds it): this host on any port, plus same-origin when proxied
      EDITOR_FRAME_ANCESTORS: "'self' http://${WHOOBE_HOSTNAME:-localhost}:* https://${WHOOBE_HOSTNAME:-localhost}"
    ports:
      - "${WS_APP_BIND_ADDRESS:-0.0.0.0}:${WS_WHOOBE_ONE_SPIKE_PORT:-3006}:8080"
    restart: unless-stopped

  gateway:
    build:
      context: .
      target: gateway
    ports:
      - "${WS_APP_BIND_ADDRESS:-0.0.0.0}:${WS_GATEWAY_PORT:-3001}:3001"
    env_file: ${ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      GATEWAY_CORE_API_URL: http://core-api:3003
      GATEWAY_ASSET_PROCESSOR_URL: http://asset-processor:3002
      GATEWAY_DEFAULT_RATE_LIMIT_RPS: "10"
      GATEWAY_RATE_LIMIT_BACKEND: memory
    depends_on:
      core-api:
        condition: service_healthy
      asset-processor:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  garagedata:
