openapi: 3.0.3
info:
  title: Whoobe CMS API
  description: >
    HTTP APIs exposed by this monorepo's backend services (core-api, gateway,
    asset-processor). Companion machine-readable spec for
    docs/release/api/api-reference.md - generated from the same route table (see
    docs/release/api/gen-api-docs.py), so treat that script, not this file directly,
    as the source of truth when routes change.
  version: "1.0"
servers:
  - url: http://localhost:3003
    description: core-api (local dev)
  - url: http://localhost:3001
    description: gateway (local dev)
  - url: http://localhost:3002
    description: asset-processor (local dev)
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wcms_session
      description: Admin session cookie, set by POST /auth/login.
    gatewaySiteKey:
      type: apiKey
      in: header
      name: X-Whoobe-Site-Key
      description: >
        Optional per-website key (see docs/release/guides/api-gateway-security.md).
        A resolved gatewayBindingId is the mandatory server-side check either
        way; this key adds per-site scoping/rate-limiting/revocation on top.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
    WhoobePage:
      type: object
      description: A whoobe_pages row - see packages/core/src/db/whoobe-pages-schema.ts.
      properties:
        id: { type: string, format: uuid }
        translationGroupId: { type: string, format: uuid }
        locale: { type: string, example: en }
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        kind: { type: string, enum: [content, module, app] }
        published: { type: boolean }
        workflowState: { type: string, nullable: true }
        content:
          type: object
          description: A WhoobeElementNode tree (packages/sdk/schema) - opaque jsonb.
        websiteId: { type: string, format: uuid, nullable: true }
        themeId: { type: string, format: uuid, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WhoobePageInput:
      type: object
      required: [slug, title, content]
      properties:
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        kind: { type: string, enum: [content, module, app] }
        content:
          type: object
          description: A WhoobeElementNode tree (packages/sdk/schema).
        locale: { type: string }
        websiteId: { type: string, format: uuid, nullable: true }
        themeId: { type: string, format: uuid, nullable: true }
        published: { type: boolean }
  responses:
    Unauthorized:
      description: Missing/invalid session, or missing permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /auth/login:
    post:
      tags: ["core-api: Auth"]
      summary: "Log in with email/password. Sets the session cookie, or returns `{ mfaRequired: true, mfaToken }` if 2FA is enabled."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in, or a pending 2FA challenge.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/AuthUser' }
                  - type: object
                    properties:
                      mfaRequired: { type: boolean, enum: [true] }
                      mfaToken: { type: string }
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/challenge:
    post:
      tags: ["core-api: Auth"]
      summary: "Step 2 of a 2FA login: verify a TOTP code (or a recovery code) against a pending mfaToken and complete the session."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/status:
    get:
