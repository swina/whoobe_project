openapi: 3.0.3
info:
  title: Whoobe API
  description: >
    HTTP APIs exposed by this monorepo's backend services (core-api, gateway,
    asset-processor). Companion machine-readable spec for
    docs/release/api/api-reference.md - generated from the same route table (see
    docs/release/api/gen-api-docs.py), so treat that script, not this file directly,
    as the source of truth when routes change.
  version: "1.0"
servers:
  - url: http://localhost:3003
    description: core-api (local dev)
  - url: http://localhost:3001
    description: gateway (local dev)
  - url: http://localhost:3002
    description: asset-processor (local dev)
security:
  - sessionCookie: []
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: wcms_session
      description: Admin session cookie, set by POST /auth/login.
    gatewaySiteKey:
      type: apiKey
      in: header
      name: X-Whoobe-Site-Key
      description: >
        Optional per-website key (see docs/release/communication/api-gateway-security.md).
        A resolved gatewayBindingId is the mandatory server-side check either
        way; this key adds per-site scoping/rate-limiting/revocation on top.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    AuthUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        permissions:
          type: array
          items: { type: string }
    WhoobePage:
      type: object
      description: A whoobe_pages row - see packages/core/src/db/whoobe-pages-schema.ts.
      properties:
        id: { type: string, format: uuid }
        translationGroupId: { type: string, format: uuid }
        locale: { type: string, example: en }
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        kind: { type: string, enum: [content, module, app] }
        published: { type: boolean }
        workflowState: { type: string, nullable: true }
        content:
          type: object
          description: A WhoobeElementNode tree (packages/sdk/schema) - opaque jsonb.
        websiteId: { type: string, format: uuid, nullable: true }
        themeId: { type: string, format: uuid, nullable: true }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WhoobePageInput:
      type: object
      required: [slug, title, content]
      properties:
        slug: { type: string }
        title: { type: string }
        category: { type: string }
        kind: { type: string, enum: [content, module, app] }
        content:
          type: object
          description: A WhoobeElementNode tree (packages/sdk/schema).
        locale: { type: string }
        websiteId: { type: string, format: uuid, nullable: true }
        themeId: { type: string, format: uuid, nullable: true }
        published: { type: boolean }
  responses:
    Unauthorized:
      description: Missing/invalid session, or missing permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /auth/login:
    post:
      tags: ["core-api: Auth"]
      summary: "Log in with email/password. Sets the session cookie, or returns `{ mfaRequired: true, mfaToken }` if 2FA is enabled, or `{ mfaEnrolmentRequired: true, enrolToken }` (no session) if the user's role requires 2FA and none is set up yet. With single sign-on set to \"administrators only\" it answers 403 to everybody else."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        "200":
          description: Logged in, or a pending 2FA challenge.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      user: { $ref: '#/components/schemas/AuthUser' }
                  - type: object
                    properties:
                      mfaRequired: { type: boolean, enum: [true] }
                      mfaToken: { type: string }
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/challenge:
    post:
      tags: ["core-api: Auth"]
      summary: "Step 2 of a 2FA login: verify a TOTP code (or a recovery code) against a pending mfaToken and complete the session."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/enrol/setup:
    post:
      tags: ["core-api: Auth"]
      summary: "Forced enrolment, step 1: with the `enrolToken` of the login, returns a TOTP secret + QR code. Public (the token stands in for the session; ten minutes, five wrong codes spend it)."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/enrol/verify:
    post:
      tags: ["core-api: Auth"]
      summary: "Forced enrolment, step 2: a TOTP code with the `enrolToken` enables the factor, returns the recovery codes once and opens the session."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/status:
    get:
      tags: ["core-api: Auth"]
      summary: "Whether the current user has 2FA enabled."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/setup:
    post:
      tags: ["core-api: Auth"]
      summary: "Start 2FA enrollment; returns a TOTP secret + QR code."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/verify-setup:
    post:
      tags: ["core-api: Auth"]
      summary: "Confirm a TOTP code to finish enrollment; returns one-time recovery codes."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/mfa/disable:
    post:
      tags: ["core-api: Auth"]
      summary: "Disable 2FA (requires re-entering the password). `409` for a user whose role requires 2FA."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/password-policy:
    get:
      tags: ["core-api: Auth"]
      summary: "The minimum a new password must satisfy: `{ minLength, requireClasses }`. Public, no secret."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/oidc/config:
    get:
      tags: ["core-api: Auth"]
      summary: "Whether single sign-on is on and the button text: `{ enabled, label, localLogin }`. Public; nothing else about the provider."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/oidc/login:
    get:
      tags: ["core-api: Auth"]
      summary: "Starts the OpenID Connect sign-in: redirects to the provider (authorization code, PKCE S256, state, nonce) and sets a short `wcms_oidc` cookie. `404` when it is off."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/oidc/callback:
    get:
      tags: ["core-api: Auth"]
      summary: "The provider's redirect back. Checks the state and the browser's cookie, exchanges the code, verifies the ID token, opens the session and redirects to the dashboard, or to `/?sso_error=<code>`."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: ["core-api: Auth"]
      summary: "Revoke the current session and clear the cookie."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: ["core-api: Auth"]
      summary: "Current user's id, email, display name, and effective permissions."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/forgot-password:
    post:
      tags: ["core-api: Auth"]
      summary: "Request a password-reset email."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/reset-password:
    post:
      tags: ["core-api: Auth"]
      summary: "Complete a password reset with the emailed token."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/users:
    get:
      tags: ["core-api: Auth"]
      summary: "List admin users."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: ["core-api: Auth"]
      summary: "Create an admin user."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/users/{id}:
    get:
      tags: ["core-api: Auth"]
      summary: "Get one admin user."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: ["core-api: Auth"]
      summary: "Update an admin user."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: ["core-api: Auth"]
      summary: "Delete an admin user."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/users/{id}/reset-password:
    post:
      tags: ["core-api: Auth"]
      summary: "Force-reset another user's password (admin action)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/roles:
    get:
      tags: ["core-api: Auth"]
      summary: "List roles."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: ["core-api: Auth"]
      summary: "Create a role (name + permission set)."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/roles/{id}:
    get:
      tags: ["core-api: Auth"]
      summary: "Get one role."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: ["core-api: Auth"]
      summary: "Update a role."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: ["core-api: Auth"]
      summary: "Delete a role."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /auth/permissions:
    get:
      tags: ["core-api: Auth"]
      summary: "List every permission key the system recognizes."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /documents:
    get:
      tags: ["core-api: Documents & Snippets (legacy Pimcore-migrated content)"]
      summary: "List documents migrated from Pimcore."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /documents/{id}:
    get:
      tags: ["core-api: Documents & Snippets (legacy Pimcore-migrated content)"]
      summary: "Get one document."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: ["core-api: Documents & Snippets (legacy Pimcore-migrated content)"]
      summary: "Update a document's content."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /snippets:
    get:
      tags: ["core-api: Documents & Snippets (legacy Pimcore-migrated content)"]
      summary: "List reusable content snippets (Whoobe Studio format - distinct from Whoobe One snippets below)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: ["core-api: Documents & Snippets (legacy Pimcore-migrated content)"]
      summary: "Create a snippet."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /snippets/{id}:
    delete:
      tags: ["core-api: Documents & Snippets (legacy Pimcore-migrated content)"]
      summary: "Delete a snippet."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /whoobe-one/snippets:
    get:
      tags: ["core-api: Whoobe One: Snippets"]
      summary: "List reusable block snippets (whoobe-one-spike editor format). Besides `snippets` the answer has `templateUsage`: snippet id to the website templates (website, template, slots) that place it."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: ["core-api: Whoobe One: Snippets"]
      summary: "Create a snippet."
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /whoobe-one/snippets/{id}:
    get:
      tags: ["core-api: Whoobe One: Snippets"]
      summary: "Get one snippet."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: ["core-api: Whoobe One: Snippets"]
      summary: "Update a snippet in place. Snapshots the pre-update node into version history if it changed."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: ["core-api: Whoobe One: Snippets"]
      summary: "Delete a snippet."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /whoobe-one/snippets/{id}/versions:
    get:
      tags: ["core-api: Whoobe One: Snippets"]
      summary: "List the snippet's instant version history (up to the 10 most recent prior states)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /whoobe-one/snippets/{id}/versions/{versionId}:
    get:
      tags: ["core-api: Whoobe One: Snippets"]
      summary: "Get one historical version's full node content."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /whoobe-one/snippets/{id}/render:
    post:
      tags: ["core-api: Whoobe One: Snippets"]
      summary: "Render a snippet's node tree to standalone email HTML."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /whoobe-one/snippets/{id}/thumbnail:
    put:
      tags: ["core-api: Whoobe One: Snippets"]
      summary: "Set (or clear with `null`) the snippet thumbnail: an image data URL under 400k characters."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: '#/components/responses/Unauthorized'
  /whoobe-one/snippets/{id}/lock:
    put:
      tags: ["core-api: Whoobe One: Snippets"]
      summary: "Lock or unlock a snippet (`{ locked }`). A locked snippet is not saved automatically: the editor's autosave skips it and `PATCH /whoobe-one/snippets/:id` with `autosave: true` answers 423. Manual saves are unaffected."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: See docs/release/api/api-reference.md and the route handler for the exact shape.
      responses:
        "200":
          description: OK
          content:
            application/json:
