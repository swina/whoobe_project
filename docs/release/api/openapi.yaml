  /api/v1/gateway/resolve:
    post:
      tags: ["gateway: Gateway published-site endpoints (site API key or bound content only - see docs/release/communication/api-gateway-security.md)"]
      summary: "Resolve a gateway-bound content field for a published page - the only way a published site reads third-party data. Requires a resolved gatewayBindingId (server-assigned at page-save time), not a free endpoint/route choice."
      security:
        - gatewaySiteKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bindingId]
              properties:
                bindingId:
                  type: string
                  description: Server-resolved at page-save time (never a free endpoint/route choice) - see GatewayBinding in packages/sdk/schema.
                params:
                  type: object
                  description: Dynamic placeholder values for the bound route's path/query, if any.
      responses:
        "200":
          description: The bound field's resolved value (shape depends entirely on the upstream API).
          content:
            application/json:
              schema:
                type: object
        "401":
          description: Missing/invalid site key, or the binding doesn't belong to this site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/gateway/submit:
    post:
      tags: ["gateway: Gateway published-site endpoints (site API key or bound content only - see docs/release/communication/api-gateway-security.md)"]
      summary: "Submit a gateway-bound form for a published page. Requires a resolved gatewayBindingId, same as /resolve. The reply is `{ success, response }`, plus `outcome` when the service answered a plain key of 1-32 letters, digits, `_` or `-` (the page reacts to it, see guides/marketing-automation.md)."
      security:
        - gatewaySiteKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bindingId, attributes]
              properties:
                bindingId:
                  type: string
                  description: Server-resolved at page-save time (never a free endpoint/route choice) - see GatewayBinding in packages/sdk/schema.
                attributes:
                  type: object
                  description: The submitted form's field values.
      responses:
        "200":
          description: Submission accepted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  outcome:
                    type: string
                    description: Only when the service answered a plain key (1-32 letters, digits, underscore or hyphen); anything else is dropped.
                  response:
                    description: The service's whole reply.
        "401":
          description: Missing/invalid site key, or the binding doesn't belong to this site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
