# Garage (https://garagehq.deuxfleurs.fr) as the local S3 store: one node, no replication.
# Rendered by entrypoint.sh (region from S3_REGION). Secrets are never in this file: the RPC secret comes from
# GARAGE_RPC_SECRET (derived from S3_SECRET_ACCESS_KEY when unset). The admin API is not enabled.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
replication_factor = 1

rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "__S3_REGION__"
api_bind_addr = "0.0.0.0:3900"
