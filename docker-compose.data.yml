# Whoobe CMS — full local-development stack.
#   docker compose up -d --build
#
# The Vite frontends (admin-dashboard port 3000, whoobe-one-spike port 3006,
# whoobe-studio port 3004) are served by nginx. Browser-facing API URLs are
# baked at build time via --build-arg; they default to localhost so the
# browser on the host can reach the published ports.
#
# One-time MinIO bucket setup (run once after first `up -d`):
#   docker compose exec minio sh -c "\
#     mc alias set whoobe http://localhost:9000 minioadmin minioadminpassword && \
#     mc mb whoobe/whoobe-cms"

services:
  postgres:
    image: postgres:16-alpine
    container_name: whoobe_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-whoobe_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: whoobe_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

