# Whoobe CMS — full local-development stack.
#   docker compose up -d --build
#
# The Vite frontends (admin-dashboard port 3000, whoobe-one-spike port 3006,
# whoobe-studio port 3004) are served by nginx. Browser-facing API URLs are
# baked at build time via --build-arg; they default to localhost so the
# browser on the host can reach the published ports.
#
# One-time MinIO bucket setup (run once after first `up -d`):
#   docker compose exec minio sh -c "\
#     mc alias set whoobe http://localhost:9000 <S3_ACCESS_KEY_ID> <S3_SECRET_ACCESS_KEY> && \
#     mc mb whoobe/whoobe-cms"

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: whoobe_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-whoobe_db}
    ports:
      # loopback only; WS_DATA_BIND_ADDRESS=0.0.0.0 to reach it from another machine (then use strong secrets)
      - "${WS_DATA_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: MinIO now runs as uid 10001; a data volume written by an older (root) container is handed over here.
  # Idempotent and fast; the minio service waits for it.
  minio-perms:
    build:
      context: ./docker/minio
    image: whoobe-minio:RELEASE.2025-10-15T17-29-55Z
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - miniodata:/data
    restart: "no"

  minio:
    # built from source (docker/minio/Dockerfile): MinIO's own images are no longer published on Docker Hub / Quay
    build:
      context: ./docker/minio
    image: whoobe-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: whoobe_minio
    depends_on:
      minio-perms:
        condition: service_completed_successfully
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "${WS_DATA_BIND_ADDRESS:-127.0.0.1}:9000:9000"
      - "${WS_DATA_BIND_ADDRESS:-127.0.0.1}:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

