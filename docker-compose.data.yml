# Whoobe CMS — full local-development stack.
#   docker compose up -d --build
#
# The Vite frontends (admin-dashboard port 3000, whoobe-one-spike port 3006)
# are served by nginx. Browser-facing API URLs are
# baked at build time via --build-arg; they default to localhost so the
# browser on the host can reach the published ports.
#
# Data services only (Postgres + Garage S3), separate from the apps and the SPAs: run the apps on the host
# (pnpm dev) or in docker-compose.apps.yml and point them here (DB_HOST, S3_ENDPOINT=http://localhost:${WS_S3_API_PORT:-9000}).
# Garage creates its own bucket and access key on first start (S3_BUCKET, S3_ACCESS_KEY_ID = GK + 24 hex,
# S3_SECRET_ACCESS_KEY = 64 hex, from the env file).
#   docker compose -f docker-compose.data.yml up -d --build
# For AWS S3 / another cloud / an enterprise S3 no local store is needed: skip the `garage` service
# (docker compose -f docker-compose.data.yml up -d postgres) and set S3_ENDPOINT & co in the env file.

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    container_name: whoobe_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-whoobe_db}
    ports:
      # loopback only; WS_DATA_BIND_ADDRESS=0.0.0.0 to reach it from another machine (then use strong secrets)
      - "${WS_DATA_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # comes back by itself after a reboot / daemon restart (the dependent services already do)
    restart: unless-stopped

  # One-shot: hands a fresh (root-owned) data volume to the unprivileged garage user. Idempotent and fast.
  garage-perms:
    build:
      context: ./docker/garage
    image: whoobe-garage:v2.4.1
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R 10001:10001 /var/lib/garage"]
    volumes:
      - garagedata:/var/lib/garage
    restart: "no"

  garage:
    # Local / LAN S3 store (docker/garage: official binary + automatic first-run setup)
    build:
      context: ./docker/garage
    image: whoobe-garage:v2.4.1
    depends_on:
      garage-perms:
        condition: service_completed_successfully
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in the env file (GK + 24 hex)}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in the env file (64 hex)}
      S3_BUCKET: ${S3_BUCKET:-whoobe-cms}
      S3_REGION: ${S3_REGION:-us-east-1}
    ports:
      # loopback only: browsers get assets through the asset-processor, not from the store
      - "${WS_DATA_BIND_ADDRESS:-127.0.0.1}:${WS_S3_API_PORT:-9000}:3900"
    volumes:
      - garagedata:/var/lib/garage
    restart: unless-stopped

