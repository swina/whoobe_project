# Garage instead of MinIO as the S3 store (overlay; MinIO is not started).
#   docker compose -f docker-compose.yml -f docker-compose.garage.yml up -d --build
# then, once: ./scripts/garage-init.sh   (layout, access key, bucket; reads the env file)
# Credentials must be in Garage's format: S3_ACCESS_KEY_ID = "GK" + 24 hex, S3_SECRET_ACCESS_KEY = 64 hex
# (plus GARAGE_RPC_SECRET = 64 hex, GARAGE_ADMIN_TOKEN). scripts/security/gen-env.sh generates them.
services:
  garage-perms:
    image: alpine:3@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /var/lib/garage/meta /var/lib/garage/data && chown -R 10001:10001 /var/lib/garage"]
    volumes:
      - garagedata:/var/lib/garage
    restart: "no"

  garage:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    user: "10001:10001"
    depends_on:
      garage-perms:
        condition: service_completed_successfully
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET (64 hex) in the env file}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN in the env file}
    volumes:
      - ./docker/garage/garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
    ports:
      # loopback only, like the other data services (browsers get assets through the asset-processor)
      - "${WS_DATA_BIND_ADDRESS:-127.0.0.1}:${WS_MINIO_API_PORT:-9000}:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # MinIO stays defined in docker-compose.yml but is not started with this overlay
  minio:
    profiles: ["minio"]
  minio-perms:
    profiles: ["minio"]

  core-api:
    environment:
      S3_ENDPOINT: http://garage:3900
  asset-processor:
    environment:
      S3_ENDPOINT: http://garage:3900
    depends_on:
      minio: !reset null
      garage:
        condition: service_healthy

volumes:
  garagedata:
