# Public sandbox overlay (docs/release/operations/sandbox.md): container hardening only. Used together with
# docker-compose.yml through COMPOSE_FILE, which the workspace profile `sandbox` (deploy/profiles/sandbox.env) writes into
# the workspace's env file. The product limits (SANDBOX_MODE, ASSET_MAX_*, ...) are in that same file and reach the
# services through their env_file, so they are not repeated here.
# SANDBOX_NO_NEW_PRIVILEGES=false only for hosts where the flag breaks image entrypoints (snap-installed Docker with
# AppArmor: "exec docker-entrypoint.sh: operation not permitted"); keep the default on a public host.
# Host ports stay (the shared nginx proxy reaches the services on 127.0.0.1): the provisioning script binds every
# port to loopback (WS_APP_BIND_ADDRESS / WS_DATA_BIND_ADDRESS = 127.0.0.1), so only the proxy is public.
x-node-hardening: &node-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
    - /app/logs:size=64m,uid=1000,gid=1000
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:${SANDBOX_NO_NEW_PRIVILEGES:-true}
  pids_limit: 256

services:
  postgres:
    security_opt: ["no-new-privileges:${SANDBOX_NO_NEW_PRIVILEGES:-true}"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
  garage:
    security_opt: ["no-new-privileges:${SANDBOX_NO_NEW_PRIVILEGES:-true}"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
  core-api:
    <<: *node-hardening
    mem_limit: 768m
    cpus: 1.0
  asset-processor:
    <<: *node-hardening
    mem_limit: 1g                # sharp
    cpus: 1.0
  gateway:
    <<: *node-hardening
    mem_limit: 384m
    cpus: 0.5
  admin-dashboard:
    security_opt: ["no-new-privileges:${SANDBOX_NO_NEW_PRIVILEGES:-true}"]
    mem_limit: 256m
    cpus: 0.5
  whoobe-one-spike:
    security_opt: ["no-new-privileges:${SANDBOX_NO_NEW_PRIVILEGES:-true}"]
    mem_limit: 256m
    cpus: 0.5
