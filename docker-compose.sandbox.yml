# Public sandbox overlay (docs/release/operations/sandbox.md). Used together with docker-compose.yml:
#   COMPOSE_FILE=docker-compose.yml:docker-compose.sandbox.yml   (scripts/sandbox/reset.sh sets it)
# Switches the product into sandbox mode (limits, disabled outbound features) and hardens the containers.
# Host ports stay (the shared nginx proxy reaches the services on 127.0.0.1): the provisioning script binds every
# port to loopback (WS_APP_BIND_ADDRESS / WS_DATA_BIND_ADDRESS = 127.0.0.1), so only the proxy is public.
x-sandbox-env: &sandbox-env
  SANDBOX_MODE: "1"
  SANDBOX_RESET_AT: ${SANDBOX_RESET_AT:-}
  ASSET_MAX_FILE_BYTES: ${ASSET_MAX_FILE_BYTES:-5242880}   # 5 MB per file
  ASSET_MAX_COUNT: ${ASSET_MAX_COUNT:-50}                  # at most 50 assets
  ASSET_MAX_INPUT_PIXELS: ${ASSET_MAX_INPUT_PIXELS:-16000000}
  PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-60}
  PUBLIC_SEARCH_RATE_LIMIT_PER_MINUTE: ${PUBLIC_SEARCH_RATE_LIMIT_PER_MINUTE:-30}
  PUBLIC_QUERY_RATE_LIMIT_PER_MINUTE: ${PUBLIC_QUERY_RATE_LIMIT_PER_MINUTE:-30}

x-node-hardening: &node-hardening
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
    - /app/logs:size=64m,uid=1000,gid=1000
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256

services:
  postgres:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
  garage:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
  core-api:
    <<: *node-hardening
    environment: *sandbox-env
    mem_limit: 768m
    cpus: 1.0
  asset-processor:
    <<: *node-hardening
    environment: *sandbox-env
    mem_limit: 1g                # sharp
    cpus: 1.0
  gateway:
    <<: *node-hardening
    environment: *sandbox-env
    mem_limit: 384m
    cpus: 0.5
  admin-dashboard:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
  whoobe-one-spike:
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.5
