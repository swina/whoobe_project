server {
    # unprivileged nginx image: non-root user cannot bind port 80
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # whoobe-one-spike is built with base /whoobe-one/ (VITE_BASE_URL) so it
    # can sit behind a reverse proxy on a sub-path. Served directly (single
    # container / published port), strip that prefix so its assets and
    # history-mode routes still resolve. Harmless for the admin-dashboard image.
    location /whoobe-one/ {
        rewrite ^/whoobe-one/(.*)$ /$1 break;
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
