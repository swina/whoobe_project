server {
    # unprivileged nginx image: non-root user cannot bind port 80
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Redirects must stay relative: behind a published port or a reverse proxy the container's own port (8080)
    # is wrong in an absolute Location (a request for `/dir` redirected the browser to localhost:8080).
    absolute_redirect off;

    # Baseline response headers. The admin is never meant to be framed (clickjacking). A full
    # Content-Security-Policy is deliberately not set yet: it is planned for the SaaS mode and needs a report-only phase.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), payment=(), usb=()" always;

    # The admin has an SPA route /assets, which collides with the build's static directory of the same name:
    # without this nginx redirected /assets to /assets/ (an empty directory listing) instead of the app.
    location = /assets { try_files /index.html =404; }

    # written at container start from the environment (render-runtime-config.sh); never cached
    location = /config.js {
        alias /tmp/whoobe-config.js;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
