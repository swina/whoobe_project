# Dependency and base-image updates as pull requests (plan 3.13). The static security scan runs on each of them.
# Tuned to keep the noise down: minor/patch updates arrive as one grouped PR per ecosystem, MAJOR upgrades are not
# proposed automatically (they are planned by hand: vite, vitest, typescript, tiptap ... each needs its own work),
# and the base images stay on the lines the project is built and tested on.
version: 2
updates:
  - package-ecosystem: npm            # pnpm workspaces are handled by this ecosystem
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: ['/', '/docker/minio']
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: node         # stay on the 22 LTS line
        update-types: ['version-update:semver-major']
      - dependency-name: golang       # MinIO is built with a specific Go release (docker/minio/Dockerfile)
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      docker-images:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
