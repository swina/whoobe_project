# Security checks (plan docs/release/security/security-testing-plan.md, section 7.1).
#   static       every pull request, every push to master with more than documents in it, nightly   (no stack; ~4 min)
#   tls          when the TLS template or this workflow changed (pull request / push), manual                (~2 min)
#   stack-tests  nightly IF code changed in the last day, manual                  (disposable stack + API + browser suites + trivy image; ~15 min)
#   isolation    nightly IF code changed in the last day, manual                  (two stacks standing for two workspaces share nothing; ~6 min)
#   dast         monthly, manual                                                  (OWASP ZAP against the disposable stack)
# Why the heavy jobs are not run on every push: a private repository has a monthly quota of Actions minutes, and every push to
# master used to cost ~30 billed minutes (four jobs, two of them building the whole stack). The same suites are run on a throwaway
# stack before pushing (scripts/security/stack.sh up; pnpm security:api; pnpm security:browser), so CI repeats them once a day, and
# on demand before a release (Actions > security > Run workflow; tick "dast" for the release commit). Documents-only pushes
# (docs/, *.md, CHANGES.md) start nothing; "[skip ci]" in a commit message skips the rest.
# Nothing here needs secrets: the stack is generated with random credentials on the runner (scripts/security/gen-env.sh).
name: security

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'CHANGES.md'
      - '.github/FUNDING.yml'
  schedule:
    - cron: '17 3 * * *'      # nightly: static scan and stack suites
    - cron: '41 4 1 * *'      # monthly: DAST
  workflow_dispatch:
    inputs:
      dast:
        description: 'Also run the ZAP DAST scan'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Cheap (seconds): decides which of the expensive jobs have anything to check.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      tls: ${{ steps.diff.outputs.tls }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            workflow_dispatch) code=true; tls=true ;;
            schedule)          files="$(git log --since='26 hours ago' --name-only --pretty=format: origin/${{ github.event.repository.default_branch }} | sort -u)" ;;
            pull_request)      files="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")" ;;
            *)                 files="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || git ls-files)" ;;
          esac
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            code=false; tls=false
            # anything that is not only documents: code, the stack, the lockfile, this workflow
            if echo "$files" | grep -Eq '^(apps/|packages/|scripts/|docker|deploy/|\.github/|package\.json|pnpm-|\.dockerignore|\.env\.example)'; then code=true; fi
            if echo "$files" | grep -Eq '^(deploy/nginx/|scripts/security/tls/|\.github/workflows/)'; then tls=true; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "tls=$tls" >> "$GITHUB_OUTPUT"
          echo "code=$code tls=$tls"

  static:
    name: static scans
    if: github.event_name != 'schedule' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0            # gitleaks scans the whole history
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Static security scan (audit, gitleaks, semgrep, shellcheck, trivy, hadolint)
        run: pnpm security:static
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-reports
          path: scripts/security/reports/
          retention-days: 30

  stack-tests:
    name: API + browser suites on a disposable stack
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the workspace packages (some suites import the SDK/publisher packages from source)
        run: pnpm build
      - name: Start the disposable stack (own DB and volumes, ports +100)
        run: scripts/security/stack.sh up
      - name: API suites
        run: pnpm security:api
      - name: Chromium for the browser suite
        run: pnpm --filter @whoobe-cms/security exec playwright install --with-deps chromium
      - name: Browser suite
        run: pnpm security:browser
      - name: Container images (trivy image; the stack's own images gate, postgres is advisory)
        run: pnpm security:images
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p whoobe-sectest logs --tail 200 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stack-test-reports
          path: |
            scripts/security/reports/
            scripts/security/test-results/
          retention-days: 30
      - name: Remove the stack and its volumes
        if: always()
        run: scripts/security/stack.sh down || true

  tls:
    name: TLS template (testssl.sh, nginx ${{ matrix.image }})
    needs: changes
    if: needs.changes.outputs.tls == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # the image of docker-compose.proxy.yml and the nginx an older host distribution still ships
        image: ['nginx:alpine', 'nginx:1.18-alpine']
    steps:
      - uses: actions/checkout@v7
      - name: testssl.sh on deploy/nginx/workspace-ssl.conf.template (TLS 1.2/1.3 only, no CBC/non-PFS, HSTS)
        run: scripts/security/tls/run-testssl.sh '${{ matrix.image }}'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testssl-${{ strategy.job-index }}
          path: scripts/security/reports/
          retention-days: 30

  isolation:
    name: workspace isolation (two stacks)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '17 3 * * *' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stack A and stack B (own databases, buckets, ports and secrets), then the isolation suite
        run: pnpm security:isolation
      - name: Stack logs on failure
        if: failure()
        run: |
          docker compose -p whoobe-sectest logs --tail 100 || true
          docker compose -p whoobe-sectest-b logs --tail 100 || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolation-reports
          path: scripts/security/reports/
          retention-days: 30
      - name: Remove both stacks and their volumes
        if: always()
        run: |
          scripts/security/stack.sh down || true
          SEC_STACK=b scripts/security/stack.sh down || true

  dast:
    name: DAST (OWASP ZAP)
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.dast) ||
      (github.event_name == 'schedule' && github.event.schedule == '41 4 1 * *')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/security/stack.sh up
      - name: ZAP API scans (active) and SPA baselines
        run: scripts/security/dast/run-zap.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: zap-reports
          path: scripts/security/reports/
          retention-days: 90
      - name: Remove the stack and its volumes
        if: always()
        run: scripts/security/stack.sh down || true
