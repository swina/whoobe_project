# Release from a tag vX.Y.Z (docs/release/release-process.md, steps 5 to 7): service images for amd64 and arm64 on ghcr.io,
# signed with cosign (keyless) and with a build provenance attestation, and a DRAFT GitHub Release with the notes, openapi.yaml and the source SBOM. The draft is
# published by hand after review. The tag must be annotated and signed (verified by GitHub), or nothing is built. The gates (scripts/release.sh check) are run before tagging, not here.
# The admin-dashboard and whoobe-one-spike images are NOT published: they bake VITE_* URLs at build time, so each
# installation builds them (docs/release/operations/upgrade-and-migrations.md, section 1).
name: release

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

jobs:
  tag:
    name: signed tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: The tag is annotated and its signature is verified by GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")"
          [ "$(echo "$ref" | jq -r .object.type)" = tag ] || { echo "$GITHUB_REF_NAME is a lightweight tag: use git tag -s (docs/release/release-process.md, step 4)" >&2; exit 1; }
          v="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(echo "$ref" | jq -r .object.sha)" --jq .verification)"
          [ "$(echo "$v" | jq -r .verified)" = true ] || { echo "signature of $GITHUB_REF_NAME not verified: $(echo "$v" | jq -r .reason)" >&2; exit 1; }

  images:
    name: image ${{ matrix.service }}
    needs: tag
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write       # cosign keyless and build provenance
      attestations: write   # build provenance
    strategy:
      fail-fast: false
      matrix:
        service: [core-api, asset-processor, gateway, publisher]
    steps:
      - uses: actions/checkout@v7
      - name: Version and image name
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$version" = "$(node -p "require('./package.json').version")" ] || { echo "tag $GITHUB_REF_NAME does not match package.json" >&2; exit 1; }
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/whoobe-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.minor }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - uses: sigstore/cosign-installer@v3
      - name: Sign the image by digest
        run: cosign sign --yes "${{ steps.v.outputs.image }}@${{ steps.push.outputs.digest }}"
      - name: Build provenance (SLSA), stored with the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.v.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Record the digest
        run: echo "${{ matrix.service }} ${{ steps.v.outputs.image }}@${{ steps.push.outputs.digest }}" > digest-${{ matrix.service }}.txt
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.service }}
          path: digest-${{ matrix.service }}.txt

  release:
    name: draft GitHub Release
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Source SBOM (CycloneDX)
        run: scripts/release/sbom.sh
      - name: Notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/release/release-notes-$version.md"
          [ -f "$notes" ] && cp "$notes" notes.md || echo "Release $GITHUB_REF_NAME. No notes file ($notes): see CHANGES.md." > notes.md
          { echo; echo '## Images (by digest, signed with cosign, keyless)'; echo; echo '```'; cat digests/*.txt; echo '```'; } >> notes.md
      - name: Create the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Whoobe $GITHUB_REF_NAME" \
            --notes-file notes.md docs/release/api/openapi.yaml .release/sbom/*.cdx.json
